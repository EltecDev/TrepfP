plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'

    id("kotlin-kapt")
    id 'com.google.gms.google-services'

}

android {
    namespace 'com.example.trepfp'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.trepfp"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "Version 2.0 Health"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        viewBinding true
    }

    dexOptions {
        javaMaxHeapSize "4g" // Ajustar según sea necesario
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'org.chromium.net:cronet-embedded:119.6045.31'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    implementation 'com.google.firebase:firebase-firestore:25.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation("com.airbnb.android:lottie:5.2.0")
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation files('libs/ImberaTREFP-debug.aar')
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.apache.poi:poi:5.2.4'
    implementation 'org.apache.poi:poi-ooxml:5.1.0'
    implementation 'javax.xml.stream:stax-api:1.0-2'
//    implementation files('libs/temperaturaJhr.aar')
    implementation "androidx.room:room-runtime:2.6.1"

//    kapt "androidx.room:room-compiler:2.6.1"
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"

    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.4"

//    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.1")
